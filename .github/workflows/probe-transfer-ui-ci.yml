name: Packaged probe migration acceptance

on:
  pull_request:
  push:
    branches: [main, master, develop, 'feature/**']

permissions:
  contents: read

concurrency:
  group: probe-transfer-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-ui:
    name: Installed app probe migration and recovery
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Check out the reviewed ShellBeam Server
        uses: actions/checkout@v4
        with:
          repository: 0xJean/shellbeam-server
          ref: ff2dc11ab1feaf480ef39c67b946f35cad0ffb9b
          path: .tmp/monitoring-server-input
          persist-credentials: false
      - name: Build exact server for isolated targets
        run: |
          test "$(git -C .tmp/monitoring-server-input rev-parse HEAD)" = ff2dc11ab1feaf480ef39c67b946f35cad0ffb9b
          docker build --target artifacts --build-arg VERSION_HASH=ff2dc11ab1feaf480ef39c67b946f35cad0ffb9b --output "type=local,dest=$RUNNER_TEMP/shellbeam-server-input" .tmp/monitoring-server-input
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          # npm ci uses the lockfile directly; npm cache restore can stall on egress limits.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: ops-ui-release
          cache-on-failure: true
      - name: Install real native UI and observation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev webkit2gtk-driver libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev openssh-server dbus xvfb xauth x11-utils imagemagick tesseract-ocr tesseract-ocr-eng fonts-dejavu-core build-essential pkg-config curl ca-certificates libnotify-dev libx11-dev libxinerama-dev libxrandr-dev libxss-dev libxext-dev libpango1.0-dev libgdk-pixbuf-2.0-dev
          sudo install -d /run/sshd
      - run: npm ci
      - name: Check migration UI fixture and recovery contracts
        run: |
          node --test scripts/probe-transfer-ui.test.mjs
          bash -n scripts/ci-probe-transfer-ui.sh
      - name: Build isolated systemd target machines
        run: docker build -t shellbeam-probe-transfer-fixture:ci scripts/fixtures/probe-transfer
      - name: Install pinned external Tauri WebDriver
        run: cargo install tauri-driver --version 0.1.5 --locked --root "$RUNNER_TEMP/shellbeam-webdriver"
      - name: Build real release Debian package with a distinct test binary filename
        run: npx tauri build --ci --bundles deb --no-sign --config src-tauri/tauri.ops-ui.conf.json
      - name: Install package and exercise native UI as ordinary runner user
        timeout-minutes: 20
        env:
          SHELLBEAM_OPS_UI_LIVE: '1'
          SHELLBEAM_OPS_UI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test ! -e /usr/bin/shellbeam-ops-ui-acceptance
          mapfile -t ui_packages < <(find src-tauri/target/release/bundle/deb -maxdepth 1 -type f -name '*.deb')
          test "${#ui_packages[@]}" = 1
          ui_package="${ui_packages[0]}"
          ui_package_name="$(dpkg-deb --field "$ui_package" Package)"
          test "$ui_package_name" = shell-beam
          if dpkg-query -W "$ui_package_name" >/dev/null 2>&1; then exit 1; fi
          cleanup_package() {
            local ui_exit=$?
            trap - EXIT
            sudo dpkg --remove "$ui_package_name" || ui_exit=1
            test ! -e /usr/bin/shellbeam-ops-ui-acceptance || ui_exit=1
            exit "$ui_exit"
          }
          trap cleanup_package EXIT
          sudo dpkg --install "$ui_package"
          test -x /usr/bin/shellbeam-ops-ui-acceptance
          bash scripts/ci-probe-transfer-ui.sh "$RUNNER_TEMP/shellbeam-webdriver/bin/tauri-driver"
      - name: Upload only redacted migration results and safe UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-transfer-ui-result
          path: |
            ${{ runner.temp }}/shellbeam-transfer-ui-report.json
            ${{ runner.temp }}/shellbeam-transfer-ui-artifacts/*.png
          if-no-files-found: warn
          retention-days: 7
