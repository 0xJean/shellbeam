name: Build signed optional agent
on:
  workflow_dispatch:
    inputs:
      version:
        description: Agent SemVer (must match agent/Cargo.toml)
        required: true
        default: 0.1.0
      channel:
        type: choice
        options: [stable, preview, canary]
        default: preview
      rollout_percentage:
        description: Signed rollout percentage (integer 0-100; installation still requires confirmation)
        type: number
        default: 5
      previous_hashes:
        description: Optional JSON object mapping artifact IDs to their previous executable SHA-256
        type: string
        default: '{}'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - name: Require a manual dispatch from the default branch
        env:
          AGENT_RELEASE_EVENT: ${{ github.event_name }}
          AGENT_RELEASE_REF_TYPE: ${{ github.ref_type }}
          AGENT_RELEASE_REF_NAME: ${{ github.ref_name }}
          AGENT_RELEASE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          if [ "$AGENT_RELEASE_EVENT" != workflow_dispatch ] ||
             [ "$AGENT_RELEASE_REF_TYPE" != branch ] ||
             [ -z "$AGENT_RELEASE_DEFAULT_BRANCH" ] ||
             [ "$AGENT_RELEASE_REF_NAME" != "$AGENT_RELEASE_DEFAULT_BRANCH" ]; then
            echo 'Agent release requires a manual dispatch from the default branch.' >&2
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test publisher without production signing keys
        run: node --test agent/scripts/publish-release.test.mjs
  build:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux
            architecture: x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux
            architecture: aarch64
          - runner: macos-15
            target: aarch64-apple-darwin
            platform: macos
            architecture: aarch64
          - runner: macos-15
            target: x86_64-apple-darwin
            platform: macos
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Check version, test native daemon and build
        env:
          AGENT_RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          test "$(cargo metadata --manifest-path agent/Cargo.toml --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')" = "$AGENT_RELEASE_VERSION"
          cargo test --manifest-path agent/Cargo.toml --locked
          cargo build --manifest-path agent/Cargo.toml --release --locked --target ${{ matrix.target }}
          mkdir -p agent/dist
          cp agent/target/${{ matrix.target }}/release/shellbeam-agent agent/dist/shellbeam-agent-${{ matrix.platform }}-${{ matrix.architecture }}
      - uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.platform }}-${{ matrix.architecture }}
          path: agent/dist/*
  sign-draft:
    needs: [validate, build]
    if: github.event_name == 'workflow_dispatch' && github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    environment: agent-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: agent-*
          merge-multiple: true
          path: agent/dist
      - name: Sign catalog
        env:
          AGENT_ARTIFACT_SIGNING_KEY_PEM: ${{ secrets.AGENT_ARTIFACT_SIGNING_KEY_PEM }}
          AGENT_RELEASE_SIGNING_KEY_PEM: ${{ secrets.AGENT_RELEASE_SIGNING_KEY_PEM }}
          AGENT_RELEASE_VERSION: ${{ inputs.version }}
          AGENT_RELEASE_CHANNEL: ${{ inputs.channel }}
          AGENT_ROLLOUT_PERCENTAGE: ${{ inputs.rollout_percentage }}
          AGENT_PREVIOUS_HASHES: ${{ inputs.previous_hashes }}
        run: node agent/scripts/publish-release.mjs --input-dir agent/dist --output agent/dist/release-catalog.json --version "$AGENT_RELEASE_VERSION" --channel "$AGENT_RELEASE_CHANNEL" --rollout-percentage "$AGENT_ROLLOUT_PERCENTAGE" --previous-hashes "$AGENT_PREVIOUS_HASHES" --base-url "https://github.com/${{ github.repository }}/releases/download/agent-v$AGENT_RELEASE_VERSION"
      - name: Create reviewable release draft
        env:
          GH_TOKEN: ${{ github.token }}
          AGENT_RELEASE_VERSION: ${{ inputs.version }}
        run: gh release create "agent-v$AGENT_RELEASE_VERSION" agent/dist/* --draft --target "$GITHUB_SHA" --title "Optional ShellBeam Agent $AGENT_RELEASE_VERSION" --notes "User-level, opt-in Linux/macOS metrics collector. Configure the independently trusted artifact and release public keys in ShellBeam. Read docs/agent.md before installation."
