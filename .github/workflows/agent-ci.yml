name: Optional agent CI
on:
  pull_request:
    paths:
      - 'agent/**'
      - 'src/lib/shellbeam-agent*'
      - '.github/workflows/agent-*.yml'
  push:
    branches: [main]
    paths:
      - 'agent/**'
      - '.github/workflows/agent-*.yml'
permissions:
  contents: read
jobs:
  release-build:
    name: Agent release build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - name: Build the exact release target without production keys or publication
        run: cargo build --manifest-path agent/Cargo.toml --release --locked --target ${{ matrix.target }}
  collector:
    name: Agent collection and restart (${{ matrix.runner }})
    strategy:
      matrix:
        runner: [ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Test real daemon collection, bounded history and restart
        run: cargo test --manifest-path agent/Cargo.toml --locked
      - name: Lint standalone collector
        run: cargo clippy --manifest-path agent/Cargo.toml --locked --all-targets -- -D warnings
      - name: Verify signed catalog publisher
        run: node --test agent/scripts/publish-release.test.mjs
  user-service:
    name: Real Linux user service lifecycle
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Build agent
        run: cargo build --manifest-path agent/Cargo.toml --locked
      - name: Prepare isolated runner user service manager
        run: |
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@$(id -u).service"
      - name: Install, activate, upgrade and uninstall unprivileged agent
        env:
          SHELLBEAM_AGENT_ALLOW_SERVICE_SMOKE: '1'
        run: |
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          agent/scripts/service-smoke.sh
