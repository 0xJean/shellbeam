name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - develop
      - 'feature/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build frontend
        run: npm run build

  native:
    name: Rust and real SSH (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux native dependencies and SSH fixture
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev openssh-server dbus dunst xvfb xauth
          sudo mkdir -p /run/sshd
      - run: npm ci
      - run: npm run build
      - name: Native unit, protocol, persistence and SSH route tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib
      - name: MCP stdio integration
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --test mcp_stdio
      - name: Reject notifications without a real desktop notification daemon
        if: runner.os == 'Linux'
        run: dbus-run-session --config-file=src-tauri/tests/fixtures/notifications-session.conf -- env SHELLBEAM_NOTIFICATION_TEST_BUS=1 cargo test --manifest-path src-tauri/Cargo.toml --locked --lib real_dbus_without_daemon_rejects_delivery -- --ignored
      - name: Receive notifications through a real isolated D-Bus and dunst
        if: runner.os == 'Linux'
        run: dbus-run-session --config-file=src-tauri/tests/fixtures/notifications-session.conf -- xvfb-run -a env SHELLBEAM_NOTIFICATION_TEST_BUS=1 cargo test --manifest-path src-tauri/Cargo.toml --locked --lib real_dbus_dunst_acknowledges_delivery -- --ignored
      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
