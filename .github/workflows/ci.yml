name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - develop
      - 'feature/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Fixed read-only MCP collector guards
        run: python3 scripts/mcp-readonly-ops.test.py

      - name: Build frontend
        run: npm run build

  native:
    name: Rust and real SSH (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux native dependencies and SSH fixture
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev openssh-server dbus dunst xvfb xauth nginx openssl busybox-static python3-venv
          sudo mkdir -p /run/sshd
      - run: npm ci
      - run: npm run build
      - name: Native unit, protocol, persistence and SSH route tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib
      - name: Verify built-in production probe trust and anonymous artifact downloads
        if: runner.os == 'Linux'
        env:
          SHELLBEAM_OFFICIAL_PROBE_RELEASE_LIVE: '1'
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib builtin_production_catalog_and_binaries_verify_without_user_configuration -- --ignored
      - name: MCP stdio integration
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --test mcp_stdio
      - name: Reject notifications without a real desktop notification daemon
        if: runner.os == 'Linux'
        run: dbus-run-session --config-file=src-tauri/tests/fixtures/notifications-session.conf -- env SHELLBEAM_NOTIFICATION_TEST_BUS=1 cargo test --manifest-path src-tauri/Cargo.toml --locked --lib real_dbus_without_daemon_rejects_delivery -- --ignored
      - name: Receive notifications through a real isolated D-Bus and dunst
        if: runner.os == 'Linux'
        run: dbus-run-session --config-file=src-tauri/tests/fixtures/notifications-session.conf -- xvfb-run -a env SHELLBEAM_NOTIFICATION_TEST_BUS=1 cargo test --manifest-path src-tauri/Cargo.toml --locked --lib real_dbus_dunst_acknowledges_delivery -- --ignored
      - name: Verify disposable Ops runner guards
        if: runner.os == 'Linux'
        run: node --test scripts/run-ops-live.test.mjs
      - name: Build native Ops IPC acceptance bridge without privileges
        if: runner.os == 'Linux'
        run: node scripts/run-ops-live.mjs --build "$RUNNER_TEMP/shellbeam-ops-live-bridge-path"
      - name: Real multi-target Docker, ACME renewal and audited direct/ProxyJump operations
        if: runner.os == 'Linux'
        timeout-minutes: 15
        env:
          SHELLBEAM_OPS_LIVE: '1'
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          bridge_path="$(cat "$RUNNER_TEMP/shellbeam-ops-live-bridge-path")"
          sudo env PATH="$PATH" GITHUB_ACTIONS="$GITHUB_ACTIONS" GITHUB_SHA="$GITHUB_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" RUNNER_OS="$RUNNER_OS" RUNNER_TEMP="$RUNNER_TEMP" SHELLBEAM_OPS_LIVE="$SHELLBEAM_OPS_LIVE" SHELLBEAM_OPS_LIVE_REPORT="$RUNNER_TEMP/shellbeam-ops-live-report.json" bash scripts/ci-ops-live.sh "$bridge_path"
      - name: Save the redacted real Ops acceptance result
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-ops-live-result
          path: ${{ runner.temp }}/shellbeam-ops-live-report.json
          if-no-files-found: warn
          retention-days: 7
      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
