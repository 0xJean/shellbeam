name: Packaged Ops UI acceptance

on:
  pull_request:
  push:
    branches: [main, master, develop, 'feature/**']

permissions:
  contents: read

concurrency:
  group: ops-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-ui:
    name: Installed Linux app, Vault and Ops UI
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          # npm ci uses the lockfile directly; npm cache restore can stall on egress limits.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: ops-ui-release
          cache-on-failure: true
      - name: Install real native UI and observation dependencies
        run: |
          sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" RUNNER_OS="$RUNNER_OS" python3 scripts/ci-ubuntu-mirror.py
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev webkit2gtk-driver libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev openssh-server dbus xvfb xauth x11-utils imagemagick tesseract-ocr tesseract-ocr-eng fonts-dejavu-core build-essential pkg-config curl ca-certificates libnotify-dev libx11-dev libxinerama-dev libxrandr-dev libxss-dev libxext-dev libpango1.0-dev libgdk-pixbuf-2.0-dev
          sudo install -d /run/sshd
      - run: npm ci
      - name: Verify transport, report and fixture guards
        run: |
          node --test scripts/ops-ui-driver.test.mjs scripts/ops-ui-journey.test.mjs scripts/ops-ui-notifications.test.mjs scripts/ci-ops-ui-live.test.mjs scripts/ops-ui-probe-fixture.test.mjs scripts/ops-ui-probe-journey.test.mjs scripts/ops-ui-probe-notifications.test.mjs
          bash -n scripts/ci-ops-ui-live.sh
          bash -n scripts/install-ops-ui-dunst.sh
      - name: Build checksum-pinned upstream dunst 1.7.3 for the real X11/count contract
        timeout-minutes: 5
        env:
          SHELLBEAM_OPS_UI_LIVE: '1'
        run: bash scripts/install-ops-ui-dunst.sh
      - name: Install pinned external Tauri WebDriver
        run: cargo install tauri-driver --version 0.1.5 --locked --root "$RUNNER_TEMP/shellbeam-webdriver"
      - name: Build real release Debian package with a distinct test binary filename
        run: npx tauri build --ci --bundles deb --no-sign --config src-tauri/tauri.ops-ui.conf.json
      - name: Install package and exercise native UI as ordinary runner user
        timeout-minutes: 20
        env:
          SHELLBEAM_OPS_UI_LIVE: '1'
          SHELLBEAM_OPS_UI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test ! -e /usr/bin/shellbeam-ops-ui-acceptance
          mapfile -t ui_packages < <(find src-tauri/target/release/bundle/deb -maxdepth 1 -type f -name '*.deb')
          test "${#ui_packages[@]}" = 1
          ui_package="${ui_packages[0]}"
          ui_package_name="$(dpkg-deb --field "$ui_package" Package)"
          test "$ui_package_name" = shell-beam
          if dpkg-query -W "$ui_package_name" >/dev/null 2>&1; then exit 1; fi
          cleanup_package() {
            local ui_exit=$?
            trap - EXIT
            sudo dpkg --remove "$ui_package_name" || ui_exit=1
            test ! -e /usr/bin/shellbeam-ops-ui-acceptance || ui_exit=1
            exit "$ui_exit"
          }
          trap cleanup_package EXIT
          sudo dpkg --install "$ui_package"
          test -x /usr/bin/shellbeam-ops-ui-acceptance
          sudo env PATH="$PATH" GITHUB_ACTIONS="$GITHUB_ACTIONS" GITHUB_SHA="$GITHUB_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" RUNNER_OS="$RUNNER_OS" RUNNER_TEMP="$RUNNER_TEMP" SHELLBEAM_OPS_UI_LIVE="$SHELLBEAM_OPS_UI_LIVE" SHELLBEAM_OPS_UI_UID="$(id -u)" SHELLBEAM_OPS_UI_GID="$(id -g)" SHELLBEAM_OPS_UI_HEAD_SHA="$SHELLBEAM_OPS_UI_HEAD_SHA" SHELLBEAM_OPS_UI_REPORT="$RUNNER_TEMP/shellbeam-ops-ui-live-report.json" SHELLBEAM_OPS_UI_ARTIFACTS="$RUNNER_TEMP/shellbeam-ops-ui-artifacts" bash scripts/ci-ops-ui-live.sh /usr/bin/shellbeam-ops-ui-acceptance "$RUNNER_TEMP/shellbeam-webdriver/bin/tauri-driver"
      - name: Upload only redacted results and controlled notification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-ops-ui-result
          path: |
            ${{ runner.temp }}/shellbeam-ops-ui-live-report.json
            ${{ runner.temp }}/shellbeam-ops-ui-artifacts/*.png
          if-no-files-found: warn
          retention-days: 7
