name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_macos:
        description: 'Build macOS GitHub release assets'
        type: boolean
        default: true
      build_linux:
        description: 'Build Linux GitHub release assets'
        type: boolean
        default: true
      build_android:
        description: 'Build Android GitHub release assets'
        type: boolean
        default: true
      build_ios:
        description: 'Upload iOS build to TestFlight'
        type: boolean
        default: false
      build_windows:
        description: 'Build Windows GitHub release assets'
        type: boolean
        default: true
      testflight_url:
        description: 'Optional TestFlight public link for release notes'
        type: string
        required: false
        default: ''

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-macos:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.build_macos)
    runs-on: macos-latest
    outputs:
      signed: ${{ steps.build.outputs.signed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable (Universal macOS targets)
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Import Apple signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::warning::Missing APPLE_CERTIFICATE secret; building ad-hoc unsigned macOS artifacts (Release will remain draft)."
            exit 0
          fi

          CERT_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASS=$(openssl rand -base64 32)

          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          rm -f "$CERT_PATH"

      - name: Build, sign, and notarize Universal macOS app
        id: build
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          SIGNED="false"
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_SIGNING_IDENTITY" ] && [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            SIGNED="true"
          else
            echo "::warning::Apple Developer ID signing/notarization secrets incomplete; falling back to ad-hoc signing."
            export APPLE_SIGNING_IDENTITY="-"
            unset APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          fi

          npm run tauri build -- --target universal-apple-darwin

          APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/ShellBeam.app"
          DMG="$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' | head -n 1)"
          test -n "$DMG"

          if [ "$SIGNED" = "true" ]; then
            echo "Notarizing outer DMG: $DMG"
            xcrun notarytool submit "$DMG" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait
            xcrun stapler staple "$DMG"

            echo "Verifying codesign, stapler, and Gatekeeper..."
            codesign -dv --verbose=2 "$APP" 2>&1 | grep -E "Authority|Identifier|TeamIdentifier|Timestamp"
            spctl -a -vvv "$APP"
            xcrun stapler validate "$APP"
            xcrun stapler validate "$DMG"
            spctl -a -t open --context context:primary-signature -vvv "$DMG"
          fi

          echo "signed=$SIGNED" >> "$GITHUB_OUTPUT"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  build-linux:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.build_linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Linux app
        run: npm run tauri build

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: warn

  build-android:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.build_android)
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.stage.outputs.signed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools'

      - name: Install Android NDK
        run: sdkmanager --install "ndk;27.0.12077973"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Decode Android signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > shellbeam.jks
            echo "ANDROID_KEYSTORE_PATH=./shellbeam.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Missing ANDROID_KEYSTORE_BASE64 secret; Android APK will be unsigned (Release will remain draft)."
          fi

      - name: Build Android app
        env:
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: npm run build:android

      - name: Verify and stage Android release artifacts
        id: stage
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          OUTPUTS="src-tauri/gen/android/app/build/outputs"
          STAGE="release-android"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"

          SIGNED_APK="$(find "$OUTPUTS" -name '*-universal-release.apk' ! -name '*-unsigned.apk' 2>/dev/null | head -n 1 || true)"
          UNSIGNED_APK="$(find "$OUTPUTS" -name '*-unsigned.apk' 2>/dev/null | head -n 1 || true)"
          AAB_PATH="$(find "$OUTPUTS" -name '*.aab' 2>/dev/null | head -n 1 || true)"

          SIGNED="false"
          if [ -n "${ANDROID_KEYSTORE_PATH:-}" ] && [ -n "$SIGNED_APK" ]; then
            BUILD_TOOLS_DIR="$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -n 1)"
            "$BUILD_TOOLS_DIR/apksigner" verify --verbose "$SIGNED_APK"
            cp "$SIGNED_APK" "$STAGE/ShellBeam_${VERSION}_universal.apk"
            if [ -n "$AAB_PATH" ]; then
              cp "$AAB_PATH" "$STAGE/ShellBeam_${VERSION}_universal.aab"
            fi
            SIGNED="true"
          else
            if [ -n "$UNSIGNED_APK" ]; then
              cp "$UNSIGNED_APK" "$STAGE/"
            fi
            if [ -n "$AAB_PATH" ]; then
              cp "$AAB_PATH" "$STAGE/"
            fi
          fi

          rm -f shellbeam.jks
          ls -lh "$STAGE"
          echo "signed=$SIGNED" >> "$GITHUB_OUTPUT"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android
          path: release-android/*
          if-no-files-found: warn

  build-windows:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.build_windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Windows app
        run: npm run tauri build

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

  ios-testflight:
    if: >-
      (github.event_name == 'push' && (vars.ENABLE_IOS_TESTFLIGHT == 'true' || vars.ENABLE_IOS_BUILD == 'true')) ||
      (github.event_name == 'workflow_dispatch' && inputs.build_ios)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-apple-ios

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Import Apple signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          : "${APPLE_CERTIFICATE:?Missing APPLE_CERTIFICATE secret for TestFlight upload}"
          : "${APPLE_CERTIFICATE_PASSWORD:?Missing APPLE_CERTIFICATE_PASSWORD secret for TestFlight upload}"

          CERT_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASS=$(openssl rand -base64 32)

          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          rm -f "$CERT_PATH"

      - name: Install iOS provisioning profile
        env:
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          if [ -z "$IOS_PROVISIONING_PROFILE" ]; then
            echo "No IOS_PROVISIONING_PROFILE secret; relying on Xcode automatic provisioning."
            exit 0
          fi

          PP_PATH=$RUNNER_TEMP/profile.mobileprovision
          echo "$IOS_PROVISIONING_PROFILE" | base64 --decode > "$PP_PATH"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/
          rm -f "$PP_PATH"

      - name: Build and upload iOS to TestFlight
        env:
          IOS_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run build:ios:tf

  # Uses the same ref test as `release`, so a manual run on a tag is gated as well.
  acceptance:
    name: Packaged acceptance
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/packaged-acceptance.yml

  release:
    # Platform builds may be skipped by a manual run. Acceptance may not.
    # TestFlight-only dispatches do not create or update GitHub Release assets.
    if: >-
      always() &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.acceptance.result == 'success' &&
      (needs.build-macos.result == 'success' ||
       needs.build-linux.result == 'success' ||
       needs.build-android.result == 'success' ||
       needs.build-windows.result == 'success') &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    needs: [acceptance, build-macos, build-linux, build-android, build-windows, ios-testflight]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Acceptance artifacts share this run and must stay out of the release.
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: '{macos,linux,android,windows}'
          path: artifacts

      - name: Guard published release and clean stale unsigned draft assets
        env:
          GH_TOKEN: ${{ github.token }}
          MACOS_SIGNED: ${{ needs.build-macos.outputs.signed }}
          ANDROID_SIGNED: ${{ needs.build-android.outputs.signed }}
          MACOS_BUILT: ${{ needs.build-macos.result == 'success' }}
          ANDROID_BUILT: ${{ needs.build-android.result == 'success' }}
        run: |
          set -euo pipefail
          EXISTING_JSON="$(gh release view "$GITHUB_REF_NAME" --json isDraft,assets 2>/dev/null || true)"
          if [ -z "$EXISTING_JSON" ]; then
            exit 0
          fi
          IS_DRAFT="$(printf '%s' "$EXISTING_JSON" | jq -r '.isDraft')"
          if [ "$IS_DRAFT" = "false" ]; then
            if [ "$MACOS_BUILT" = "true" ] && [ "$MACOS_SIGNED" != "true" ]; then
              echo "::error::Refusing to overwrite published release $GITHUB_REF_NAME with an unsigned macOS DMG."
              exit 1
            fi
            if [ "$ANDROID_BUILT" = "true" ] && [ "$ANDROID_SIGNED" != "true" ]; then
              echo "::error::Refusing to overwrite published release $GITHUB_REF_NAME with an unsigned Android APK."
              exit 1
            fi
          fi
          if [ "$ANDROID_SIGNED" = "true" ]; then
            for STALE in $(printf '%s' "$EXISTING_JSON" | jq -r '.assets[].name | select(test("-unsigned\\.apk$|^app-universal-release\\.aab$"))'); do
              echo "Removing stale unsigned Android asset from existing release: $STALE"
              gh release delete-asset "$GITHUB_REF_NAME" "$STALE" --yes
            done
          fi

      - name: Stage release assets and generate SHA256SUMS
        run: |
          set -euo pipefail
          rm -rf release-assets SHA256SUMS
          mkdir -p artifacts release-assets
          find artifacts -type f \( \
            -name '*.dmg' -o \
            -name '*.deb' -o \
            -name '*.AppImage' -o \
            -name '*.rpm' -o \
            -name '*.msi' -o \
            -name '*.exe' -o \
            -name '*.apk' -o \
            -name '*.aab' \
          \) -exec cp {} release-assets/ \;
          (cd release-assets && sha256sum -- *) | sort -k2 > SHA256SUMS
          mv SHA256SUMS release-assets/SHA256SUMS
          ls -lh release-assets
          cat release-assets/SHA256SUMS

      - name: Write release notes preface
        env:
          DISPATCH_TESTFLIGHT_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.testflight_url || '' }}
          TESTFLIGHT_PUBLIC_LINK: ${{ vars.TESTFLIGHT_PUBLIC_LINK }}
          MACOS_SIGNED: ${{ needs.build-macos.outputs.signed }}
          ANDROID_SIGNED: ${{ needs.build-android.outputs.signed }}
        run: |
          TESTFLIGHT_URL="${DISPATCH_TESTFLIGHT_URL:-$TESTFLIGHT_PUBLIC_LINK}"
          {
            NOTES="docs/releases/${GITHUB_REF_NAME}.md"
            if [ -f "$NOTES" ]; then
              cat "$NOTES"
              echo ""
            fi
            echo "## Downloads"
            echo ""
            echo "- All platform builds and \`SHA256SUMS\` are attached below."
            if [ "$MACOS_SIGNED" = "true" ]; then
              echo "- macOS: Universal (\`Apple Silicon + Intel\`), Developer ID signed, Apple notarized and stapled."
            else
              echo "- macOS: Ad-hoc signed CI build (not notarized). Replace with a signed + notarized Universal DMG before publishing."
            fi
            if [ "$ANDROID_SIGNED" = "true" ]; then
              echo "- Android: Signed universal APK (4 ABIs) and signed AAB."
            else
              echo "- Android: Unsigned CI build. Replace with signed APK/AAB before publishing."
            fi
            if [ -n "$TESTFLIGHT_URL" ]; then
              echo "- iOS is distributed through TestFlight: $TESTFLIGHT_URL"
            fi
            echo ""
          } > release-notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          # Auto-publish only when macOS notarization and Android signing both succeeded.
          # Otherwise keep as draft so unsigned builds are never exposed publicly.
          draft: ${{ needs.build-macos.outputs.signed != 'true' || needs.build-android.outputs.signed != 'true' }}
          generate_release_notes: true
          body_path: release-notes.md
          fail_on_unmatched_files: false
          files: |
            release-assets/*
