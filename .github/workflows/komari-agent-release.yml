name: Publish trusted compatible probe
on:
  workflow_dispatch:
    inputs:
      version:
        description: Reviewed upstream version in releases/compatible-probe-pins.json
        required: true
        default: '1.5.11'
      revision:
        description: New immutable release revision (increment when refreshing the catalog)
        required: true
        default: '1'
permissions:
  contents: read
concurrency:
  group: compatible-probe-production-release
  cancel-in-progress: false
jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: node --test scripts/publish-komari-agent.test.mjs scripts/official-komari-agent-release.test.mjs
  publish:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    environment: komari-agent-release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Fetch reviewed upstream artifacts without signing credentials
        env:
          PROBE_VERSION: ${{ inputs.version }}
          PROBE_REVISION: ${{ inputs.revision }}
        run: node scripts/prepare-komari-agent-release.mjs "$PROBE_VERSION" "$PROBE_REVISION" "$RUNNER_TEMP/compatible-probe-release"
      - name: Recover an already signed catalog after an interrupted publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/promote-komari-agent-release.mjs --resume-catalog "$RUNNER_TEMP/compatible-probe-release" "$GITHUB_SHA"
      - name: Sign exact artifacts and expiring catalog with the production key
        env:
          PROBE_SIGNING_KEY: ${{ secrets.KOMARI_AGENT_SIGNING_KEY_PEM }}
        shell: bash
        run: |
          set -euo pipefail
          if test -f "$RUNNER_TEMP/compatible-probe-release/catalog.json"; then
            exit 0
          fi
          umask 077
          probe_key_file="$RUNNER_TEMP/compatible-probe-signing-key.pem"
          trap 'rm -f -- "$probe_key_file"' EXIT
          printf '%s' "$PROBE_SIGNING_KEY" > "$probe_key_file"
          unset PROBE_SIGNING_KEY
          node scripts/publish-komari-agent.mjs --spec "$RUNNER_TEMP/compatible-probe-release/spec.json" --key "$probe_key_file" --out "$RUNNER_TEMP/compatible-probe-release/catalog.json"
      - name: Verify uploaded bytes, publish versioned release and atomically advance feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/promote-komari-agent-release.mjs "$RUNNER_TEMP/compatible-probe-release" "$GITHUB_SHA"
      - name: Remove temporary release workspace
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/compatible-probe-release"
