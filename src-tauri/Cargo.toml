[package]
name = "app"
version = "0.1.6"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
tauri = { version = "2.10.0", features = ["unstable", "webview-data-url", "macos-proxy"] }
tauri-plugin-log = "2"
ssh2 = "0.9"
uuid = { version = "1", features = ["v4"] }
aes-gcm = "0.10.3"
pbkdf2 = "0.12.2"
sha2 = "0.10.9"
zip = { version = "2.4", default-features = false }
ed25519-dalek = "2.2"
chrono = { version = "0.4", default-features = false, features = ["std"] }
rand = "0.9.2"
base64 = "0.22.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
url = "2"
urlencoding = "2"
tauri-plugin-dialog = "2"
# Pin the v2 API used by the narrow native notification adapter.
tauri-plugin-notification = "=2.3.3"
tauri-plugin-biometry = "0.2"
tauri-plugin-window-state = "2"
lazy_static = "1"
ssh-key = { version = "0.6", features = ["ed25519"] }
dirs = "5"
libc = "0.2"
mdns-sd = "0.18"
hostname = "0.4"
if-addrs = { version = "0.15", features = ["link-local"] }

# Use vendored (statically-linked) OpenSSL on macOS, iOS and Android so the app
# doesn't depend on system libssl at runtime.
# (openssl-sys is pulled in by ssh2 → libssh2-sys)
[target.'cfg(any(target_os = "macos", target_os = "ios", target_os = "android", target_os = "windows"))'.dependencies]
openssl-sys = { version = "0.9", features = ["vendored"] }

[target.'cfg(target_os = "windows")'.dependencies]
ssh2 = { version = "0.9", features = ["openssl-on-win32"] }
webview2-com-sys = "0.38"
windows = { version = "0.61.3", features = ["UI_Notifications", "Data_Xml_Dom", "Foundation", "Win32_Foundation", "Win32_System_JobObjects", "Win32_Security", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "=0.6.3"
objc2-foundation = { version = "0.3.2", features = ["NSBundle", "NSError", "NSString"] }
objc2-user-notifications = { version = "0.3.2", default-features = false, features = ["std", "UNUserNotificationCenter", "UNNotificationSettings", "UNNotificationRequest", "UNNotificationContent", "UNNotificationTrigger", "block2"] }

[target.'cfg(target_os = "android")'.dependencies]
# Narrow, cancellable Intent.ACTION_VIEW handoff on the actual Android context.
jni = "0.21"

[target.'cfg(target_os = "ios")'.dependencies]
# Await UIKit's real openURL completion; the plugin's iOS adapter resolves early.
block2 = "0.6.2"
objc2 = "=0.6.3"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSDictionary", "NSString", "NSURL"] }
objc2-ui-kit = { version = "0.3.2", default-features = false, features = ["std", "UIApplication", "UIResponder", "block2"] }

[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies.zbus]
version = "5"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc = "0.2"

[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
webkit2gtk = "2"
